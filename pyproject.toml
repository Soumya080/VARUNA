[project]
name = "varuna-grid"
version = "2.0.0"
description = "VARUNA GRID v2 — National Marine Pollution Watch & Response Grid (SIH26143)"
# Verified on 3.11.9 in a clean clone: full install, all packages resolve,
# 635 unit+api tests pass. The pin was ">=3.12" with no 3.12-only syntax
# anywhere in packages/ or apps/, and tests/conftest.py even carries a 3.10
# compat shim. It hard-blocked `pip install -e .` before a single dependency
# downloaded, which is a hostile first experience on a fresh machine.
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # contracts / core
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  # backend
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "geoalchemy2>=0.15,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "celery>=5.3,<6.0",
  "redis>=5.0,<6.0",
  "minio>=7.2,<8.0",
  "python-multipart>=0.0.9",
  # scientific
  "numpy>=1.26,<3.0",
  "scipy>=1.12,<2.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
  "xgboost>=2.0,<3.0",
  # geospatial
  "xarray>=2024.1",
  "rioxarray>=0.15",
  "rasterio>=1.3,<2.0",
  "geopandas>=0.14,<2.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "netCDF4>=1.6,<2.0",
  # security
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  # observability
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "prometheus-client>=0.20",
  # reporting — real PDF incident reports (varuna_integration.incident_report)
  "reportlab>=4.0,<5.0",
  # notifications
  "twilio>=8.0.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "segmentation-models-pytorch>=0.3,<1.0",
  "torchgeo>=0.5",
  "mlflow>=2.12,<3.0",
  "onnxruntime>=1.17,<2.0",
]
# OpenDrift resolves poorly on pip. Prefer:
#   conda install -c opendrift -c conda-forge opendrift
physics = ["opendrift>=1.11"]
data = ["copernicusmarine>=1.3", "cdsapi>=0.6", "pyroSAR>=0.25"]
dev = [
  "playwright>=1.44",   # real-browser E2E (scripts/judge_test.py)
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# All varuna_* packages live under packages/ as one distribution.
# Rationale and rejected alternatives: docs/adr/ADR-0001-package-layout.md
[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["varuna_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps"]
markers = [
  "unit: pure logic, no I/O",
  "contract: cross-package schema compatibility",
  "integration: needs postgres/redis/minio",
  "scientific: numerical regression, seeded",
  "robustness: degraded-input and failure-injection",
  "e2e: full pipeline",
  "slow: >10s",
]
filterwarnings = ["error::DeprecationWarning:varuna_.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "experiments.*"]
disallow_untyped_defs = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
